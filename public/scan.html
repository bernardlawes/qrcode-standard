<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan · Tesserae QR</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#1f4e79">
  <script type="module" src="/src/ui/scan.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" data-app-name>Tesserae QR</a>
    <nav><a href="/generate">Build</a><a href="/scan">Scan</a></nav>
  </header>
  <main class="layout-2">
    <section class="panel">
      <h1>Scan a QR code</h1>
      <div class="actions">
        <button type="button" id="start-camera">Start camera</button>
        <button type="button" id="stop-camera" class="secondary" hidden>Stop camera</button>
        <button type="button" id="paste-image" class="secondary" hidden>Paste image</button>
      </div>
      <div id="viewport" class="viewport" hidden>
        <video id="video" playsinline muted></video>
        <div class="reticle" aria-hidden="true"></div>
      </div>
      <label id="drop-zone" class="drop-zone">
        <span><strong>Choose</strong> | Drag &amp; Drop | Paste Image</span>
        <input type="file" id="file" accept="image/*">
      </label>
      <p id="scan-status" role="status" aria-live="polite" hidden></p>
      <p class="muted small">Decoding happens on your device. Nothing is uploaded, and links do not open automatically.</p>
    </section>
    <section class="panel result" id="result" tabindex="-1" aria-live="polite" hidden></section>
  </main>
</body>
</html>
